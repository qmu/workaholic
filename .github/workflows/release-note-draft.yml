name: Release Note Draft

# Keeps each deployment target's GitHub DRAFT release current, and is the ONLY
# writer of it. The draft is the non-authoritative projection of what
# `ship/scripts/draft-release-note.sh` derives from the base state; the derivation
# is the source of truth, so this job re-renders and overwrites rather than merges.
#
# WHY CI AND NOT THE HOURLY TICK. `[Prepare Release]` runs in a Claude Code Web
# container, which cannot write a release by any transport: `gh release` is
# GraphQL-backed and refused, and REST answers "Creating, editing, or deleting
# releases is not permitted for this session type". A tick that kept trying would
# report a permanent, expected condition as `degraded` every hour. This repository
# already makes CI its release writer (release.yml), so the capability is used
# where it exists. The tick keeps its reading half and calls the cadence WITHOUT
# `--write`, which is what makes /prepare-release the pure reader it declares
# itself to be.
#
# WHY fetch-depth: 0 AND TAGS. The renderer's boundary is the latest release tag.
# A clone without tags collapses it to `full_history` and reports a meaningless
# count — measured 2026-08-18, when a routine container holding no tags and a
# five-day-stale origin/main reported 9, then 191, against a true 8. CI defines
# its own input instead of inheriting a container's.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-note-draft
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    # Job-level so the planner steps can gate on its PRESENCE (`env.X != ''` is not
    # available for a secret referenced only at step level). An absent key skips the
    # planner and is reported by the note, never by a failing job.
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # THE JUDGMENT RUNS HERE TOO, BESIDE THE WRITER (2026-08-18, issue #512).
      # A deterministic renderer cannot decide what ships together, in what order
      # or at what risk; an agent can. This is the one place that holds both the
      # write permission and a defined checkout, so the plan and the write happen
      # together and nothing crosses between them — which is how it answers
      # `workaholic:ship` §7's three refusals by name: nothing is committed to
      # `main`, no open pull request's branch is written, and `/ship` never runs.
      #
      # IT IS GATED ON THE CREDENTIAL AND ON WHAT IS DUE. With no
      # ANTHROPIC_API_KEY the planner step is skipped entirely, the note falls back
      # to the derived list, and the fallback SAYS SO on its face — a named,
      # visible degradation rather than a broken job. The dry run first asks the
      # cadence what it would write, so an idle base spends no agent budget.
      - name: What would the cadence write?
        id: due
        run: |
          bash plugins/workaholic/skills/ship/scripts/run-note-cadence.sh \
            --write --dry-run main > cadence-dry.json
          cat cadence-dry.json
          bash plugins/workaholic/skills/ship/scripts/list-due-targets.sh cadence-dry.json \
            >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install the planner
        if: steps.due.outputs.targets != '' && env.ANTHROPIC_API_KEY != ''
        run: npm install -g @anthropic-ai/claude-code

      - name: Author each due target's release plan
        if: steps.due.outputs.targets != '' && env.ANTHROPIC_API_KEY != ''
        run: |
          mkdir -p .release-plans
          for slug in ${{ steps.due.outputs.targets }}; do
            bash plugins/workaholic/skills/ship/scripts/plan-release.sh \
              --target "$slug" --out .release-plans main
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Refresh each target's draft release note
        run: |
          bash plugins/workaholic/skills/ship/scripts/run-note-cadence.sh \
            --write --plan-dir .release-plans main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
